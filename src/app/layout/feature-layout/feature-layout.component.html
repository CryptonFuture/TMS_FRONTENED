<mat-drawer-container class="main-container">
  <!-- Sidebar -->
  <mat-drawer
    class="sidebar"
    mode="side"
    [opened]="true"
    [ngClass]="{ 'expanded': isExpanded }"
    disableClose>

    <div class="icon-list">
      <!-- Dashboard -->
      <button mat-button (click)="goToPage('app/dashboard')" [class.active]="selected === 'app/dashboard'">
        <mat-icon>dashboard</mat-icon>
        <span *ngIf="isExpanded">Dashboard</span>
      </button>

      <!-- Employees -->
      <button mat-button (click)="goToPage('app/user-managment/employee/employeeListActive')" [class.active]="selected === 'app/user-managment/employee/employeeListActive'">
        <mat-icon>people</mat-icon>
        <span *ngIf="isExpanded">Employees</span>
      </button>

      <!-- 🔹 Tasks -->
      <button mat-button (click)="goToPage('app/task-managment/task/taskList')" [class.active]="selected === 'app/task-managment/task/taskList'">
        <mat-icon>assignment</mat-icon>
        <span *ngIf="isExpanded">Task Client</span>
      </button>
    </div>
  </mat-drawer>

  <!-- Main content -->
  <mat-drawer-content>
    <div class="content-wrapper" [class.shifted]="isExpanded">
      <feature-header (toggle)="toggleSidebar()"></feature-header>

      <div class="main-content">
        <router-outlet></router-outlet>
      </div>

      <feature-footer></feature-footer>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
