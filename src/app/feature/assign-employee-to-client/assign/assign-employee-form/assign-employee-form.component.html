<!--component html goes here -->
<div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; margin-bottom: 60px;">
  <mat-card style="width: 100%; max-width: 600px; padding: 20px;">
    
    <!-- Title and Button -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <mat-card-title>Assign Form</mat-card-title>
      
    </div>

    <mat-card-content>
      <form [formGroup]="assignForm" (ngSubmit)="onSubmit()" style="width: 100%;">

        <!-- Employee -->
        <mat-form-field appearance="fill" style="width: 100%; margin-top: 10px;">
          <mat-label>Select Employee</mat-label>
          <mat-select formControlName="userEmployeeId">
            <mat-option *ngFor="let user of employeeActiveList || []" [value]="user._id">
              {{ user.name }}
            </mat-option>
          </mat-select>
          <!-- Validation Message -->
          <mat-error *ngIf="assignForm.get('userEmployeeId')?.touched && assignForm.get('userEmployeeId')?.invalid">
            Please select an employee
          </mat-error>
        </mat-form-field>

        <!-- Description -->
        <mat-form-field appearance="fill" style="width: 100%; margin-top: 10px;">
          <mat-label>Description</mat-label>
          <textarea matInput rows="3" formControlName="description"></textarea>
          <mat-error *ngIf="assignForm.get('description')?.touched && assignForm.get('description')?.invalid">
            Description is required
          </mat-error>
        </mat-form-field>

        <!-- Submit Button -->
        <div style="display: flex; justify-content: center; margin-top: 16px;">
          <button mat-raised-button color="primary" type="submit" [disabled]="assignForm.invalid">
            Submit
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
