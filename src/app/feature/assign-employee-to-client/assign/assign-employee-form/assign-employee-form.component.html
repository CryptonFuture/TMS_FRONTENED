<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh; margin-bottom: 60px;">
  <mat-card style="width: 100%; max-width: 600px; padding: 20px;">

    <!-- Title -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <mat-card-title>Assign Form</mat-card-title>
      <button mat-raised-button color="accent" type="button" (click)="goToAssignClientList()">
        View Assign Clients List
      </button>
      
    </div>

    

    <mat-card-content>
      

      <form [formGroup]="assignForm" (ngSubmit)="onSubmit()" style="width: 100%;">

        <!-- Employee -->
        <mat-form-field appearance="fill" style="width: 100%; margin-top: 10px;">
          <mat-label>Select Employee</mat-label>
          <mat-select formControlName="userEmployeeId">
            <mat-option *ngFor="let user of employeeActiveList || []" [value]="user._id">
              {{ user.name }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="assignForm.get('userEmployeeId')?.touched && assignForm.get('userEmployeeId')?.invalid">
            Please select an employee
          </mat-error>
        </mat-form-field>

        <!-- Client -->
        <mat-form-field appearance="fill" style="width: 100%; margin-top: 10px;">
          <mat-label>Select Client</mat-label>
          <mat-select formControlName="clientId">
            <mat-option *ngFor="let client of clientExistList || []" [value]="client._id">
              {{ client.name }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="assignForm.get('clientId')?.touched && assignForm.get('clientId')?.invalid">
            Please select a client
          </mat-error>

        </mat-form-field>

        
        <!-- Task -->
        <mat-form-field appearance="fill" style="width: 100%; margin-top: 10px;">
          <mat-label>Select Task</mat-label>
          <mat-select formControlName="taskId">
            <mat-option *ngFor="let task of taskActiveList || []" [value]="task._id">
              {{ task.name }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="assignForm.get('taskId')?.touched && assignForm.get('taskId')?.invalid">
            Please select a Task
          </mat-error>

        </mat-form-field>

        <!-- Description -->
        <mat-form-field appearance="fill" style="width: 100%; margin-top: 10px;">
          <mat-label>Description</mat-label>
          <textarea matInput rows="3" formControlName="description"></textarea>
        </mat-form-field>

        <!-- Submit Button -->
        <div style="display: flex; justify-content: center; margin-top: 16px;">
          <button mat-raised-button color="primary" type="submit"
            [disabled]="assignForm.invalid || loading"
            style="display: flex; align-items: center; gap: 5px;">
            <span>{{ 'Submit' }}</span>
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
