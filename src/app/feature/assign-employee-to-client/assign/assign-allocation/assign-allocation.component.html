<div class="client-list-container">



  <mat-tab-group [selectedIndex]="selectedTab" (selectedTabChange)="onTabChange($event.index)">
    <mat-tab label="Assign Clients"></mat-tab>
    <mat-tab label="Non Assign Clients"></mat-tab>
  </mat-tab-group>



  <div class="top-bar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search by Name or Email</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Search..." />
      <button mat-icon-button matSuffix disabled>
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="createAssignclient()">
      <mat-icon>person_add</mat-icon>  Create Assign Client
    </button>
  </div>

  <!-- 🔹 client Table -->
<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

    <!-- Sr.No -->
    <ng-container matColumnDef="no">
      <th mat-header-cell *matHeaderCellDef>
        Sr.#
      </th>
      <td mat-cell *matCellDef="let client; let i = index"> {{i + 1}} </td>
    </ng-container>

    <!-- Name -->
    <ng-container matColumnDef="employee">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Employee Name
      </th>
      <td mat-cell *matCellDef="let client">{{client.userEmployeeId?.name}}</td>
    </ng-container>

    <!-- Email -->
    <ng-container matColumnDef="client">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Client Name
      </th>
      <td mat-cell *matCellDef="let client">{{client.clientId?.name}}</td>
    </ng-container>

    
    <!-- Task -->
    <ng-container matColumnDef="task">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Task Name
      </th>
      <td mat-cell *matCellDef="let client">{{client.taskId?.name}}</td>
    </ng-container>


    <!-- Description -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Description
      </th>
      <td mat-cell *matCellDef="let client">{{client.description}}</td>
    </ng-container>

    <!-- Action -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>
        Action
      </th>
      <td mat-cell *matCellDef="let client">
        <button mat-icon-button [matMenuTriggerFor]="menu">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="editAssignclient(client)">
            <mat-icon>edit</mat-icon>
            <span>Edit</span>
          </button>
          <button mat-menu-item (click)="deleteAssignclient(client._id)">
            <mat-icon>delete</mat-icon>
            <span>Delete</span>
          </button>
          
        </mat-menu>
      </td>
    </ng-container>

    <!-- Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- No Data -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayedColumns.length"
        style="text-align:center; padding: 16px; background-color: rgb(240, 240, 240);">
        🚫 No Assign client Found
      </td>
    </tr>
  </table>

  <!-- Pagination -->
  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
