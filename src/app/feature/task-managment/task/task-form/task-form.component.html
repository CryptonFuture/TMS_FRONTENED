<!--component html goes here -->
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh; margin-bottom: 60px;">
  <mat-card style="width: 100%; max-width: 600px; padding: 20px;">
    
    <!-- Title and Button -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <mat-card-title>Task Form</mat-card-title>
      <button mat-raised-button color="accent" type="button" (click)="goToTaskList()">
        View Task List
      </button>
      
    </div>

    <mat-card-content>
      <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" style="width: 100%;">

        <!-- Name -->
        <mat-form-field appearance="fill" style="width: 100%;">
          <mat-label>Task Name</mat-label>
          <input matInput formControlName="name">
          <mat-error *ngIf="taskForm.get('name')?.touched && taskForm.get('name')?.invalid">
           Task Name is required
          </mat-error>
        </mat-form-field>

        <!-- Description -->
        <mat-form-field appearance="fill" style="width: 100%; margin-top: 10px;">
          <mat-label>Description</mat-label>
          <textarea matInput rows="3" formControlName="description"></textarea>
          
        </mat-form-field>

        <!-- Submit Button -->
        <div style="display: flex; justify-content: center; margin-top: 16px;">
          <button mat-raised-button color="primary" type="submit" [disabled]="taskForm.invalid">
            Submit
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
