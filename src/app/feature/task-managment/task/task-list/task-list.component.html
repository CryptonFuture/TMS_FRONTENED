<!-- 🔍 Search bar + ➕ Add button -->
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
  
  <!-- Search Input -->
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search by Name </mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Search..." />
    </mat-form-field>

  <!-- Add Button -->
  <button mat-raised-button color="primary" (click)="createTask()">
    <mat-icon>add</mat-icon>
    Add Task
  </button>
</div>

<!-- Table -->
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!-- Sr.No -->
  <ng-container matColumnDef="no">
    <th mat-header-cell *matHeaderCellDef> Sr.# </th>
    <td mat-cell *matCellDef="let task; let i = index"> {{i + 1}} </td>
  </ng-container>

  <!-- UserEmployeeId -->
  <ng-container matColumnDef="userEmployeeId">
    <th mat-header-cell *matHeaderCellDef> Task Name</th>
    <td mat-cell *matCellDef="let task">{{ task.name }}</td>
  </ng-container>

  <!-- Status -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef> Status </th>
    <td mat-cell *matCellDef="let task">{{ task.status }}</td>
  </ng-container>

  <!-- Description -->
  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef> Description </th>
    <td mat-cell *matCellDef="let task">{{ task.description }}</td>
  </ng-container>

  <!-- Action -->
  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef> Action </th>
    <td mat-cell *matCellDef="let task">
      <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="editTask(task)">
          <mat-icon>edit</mat-icon>
          <span>Edit</span>
        </button>
        <button mat-menu-item (click)="deleteTask(task._id)">
          <mat-icon>delete</mat-icon>
          <span>Delete</span>
        </button>
        <button mat-menu-item (click)="viewTask(task)">
          <mat-icon>visibility</mat-icon>
          <span>View</span>
        </button>
      </mat-menu>
    </td>
  </ng-container>

  <!-- Header + Row -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  <!-- No Data -->
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" [attr.colspan]="displayedColumns.length"
        style="text-align:center; padding: 16px; background-color: rgb(164, 159, 159);">
      🚫 No task found
    </td>
  </tr>
</table>
