<div class="task-list-container">

  <!-- 🔍 Top Bar -->

  <div class="top-bar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search Task</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Search by name..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="createTask()">
      <mat-icon>add_task</mat-icon>
      Add Task
    </button>
  </div>

  <!-- 📋 Task Table -->
  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

    <!-- Sr.No -->
    <ng-container matColumnDef="no">
      <th mat-header-cell *matHeaderCellDef>#</th>
      <td mat-cell *matCellDef="let task; let i = index">{{ i + 1 }}</td>
    </ng-container>
    

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Task Name
      </th>
      <td mat-cell *matCellDef="let task">{{ task.name }}</td>
    </ng-container>


    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Status
      </th>
      <td mat-cell *matCellDef="let task">
        <span class="status-badge">{{ task.status }}</span>
      </td>
    </ng-container>


    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Description
      </th>
      <td mat-cell *matCellDef="let task">{{ task.description }}</td>
    </ng-container>


    <!-- Action -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let task">
        <button mat-icon-button [matMenuTriggerFor]="menu">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="editTask(task)">
            <mat-icon>edit</mat-icon>
            <span>Edit</span>
          </button>
          <button mat-menu-item (click)="deleteTask(task._id)">
            <mat-icon>delete</mat-icon>
            <span>Delete</span>
          </button>
          <button mat-menu-item (click)="viewTask(task)">
            <mat-icon>visibility</mat-icon>
            <span>View</span>
          </button>
        </mat-menu>
      </td>
    </ng-container>

    <!-- Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- No Data -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">
        🚫 No task found
      </td>
    </tr>

  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>

</div>
