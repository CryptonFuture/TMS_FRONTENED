<div class="dashboard-cards" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px;">

  <!-- Card 1: Employees -->
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-icon mat-card-avatar color="primary">people</mat-icon>
      <mat-card-title>No. of Employees</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <h2>{{ userData.length }}</h2>
      <p>Active Employee</p>
    </mat-card-content>
  </mat-card>

  <!-- Card 2: Projects -->
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-icon mat-card-avatar color="accent">folder_open</mat-icon>
      <mat-card-title>No. of Projects</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <!-- <h2>{{ projectData.length }}</h2> -->
      <p>0</p>
    </mat-card-content>
  </mat-card>

  <!-- Card 3: Tasks -->
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-icon mat-card-avatar color="warn">task_alt</mat-icon>
      <mat-card-title>No. of Tasks</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <!-- <h2>{{ taskData.length }}</h2> -->
      <p>0</p>
    </mat-card-content>
  </mat-card>

  <!-- Card 4: Clients -->
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-icon mat-card-avatar color="primary">groups</mat-icon>
      <mat-card-title>No. of Clients</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <!-- <h2>{{ clientData.length }}</h2> -->
      <p>0</p>
    </mat-card-content>
  </mat-card>

</div>
