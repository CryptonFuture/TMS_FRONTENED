<div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; margin-bottom: 60px;">
  <mat-card style="width: 100%; max-width: 500px; padding: 20px;">
    
    <!-- Title and Button -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <mat-card-title>Employee Form</mat-card-title>
      <button mat-raised-button color="accent" type="button" (click)="goToActiveEmployeeList()">
        View Active Employees
      </button>
    </div>

    <mat-card-content>
      <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()" style="width: 100%;">

        <!-- Name -->
        <mat-form-field appearance="fill" style="width: 100%;">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name">
          <mat-error *ngIf="employeeForm.get('name')?.touched && employeeForm.get('name')?.invalid">
            Name is required
          </mat-error>
        </mat-form-field>

        <!-- Email -->
        <mat-form-field appearance="fill" style="width: 100%;">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
          <mat-error *ngIf="employeeForm.get('email')?.touched && employeeForm.get('email')?.invalid">
            Please enter a valid email
          </mat-error>
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="fill" style="width: 100%;">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password">
          <mat-error *ngIf="employeeForm.get('password')?.touched && employeeForm.get('password')?.invalid">
            Password must be at least 6 characters
          </mat-error>
        </mat-form-field>

        <!-- Confirm Password -->
        <mat-form-field appearance="fill" style="width: 100%;">
          <mat-label>Confirm Password</mat-label>
          <input matInput type="password" formControlName="confirmPass">
          <mat-error *ngIf="employeeForm.errors?.['passwordMismatch']">
            Passwords do not match
          </mat-error>
        </mat-form-field>

        <!-- Designation -->
        <mat-form-field appearance="fill" style="width: 100%;">
          <mat-label>Designation</mat-label>
          <input matInput formControlName="designName">
        </mat-form-field>

        <!-- Address -->
        <mat-form-field appearance="fill" style="width: 100%;">
          <mat-label>Address</mat-label>
          <input matInput formControlName="address">
        </mat-form-field>

        <!-- Contact No -->
        <mat-form-field appearance="fill" style="width: 100%;">
          <mat-label>Contact No</mat-label>
          <input matInput formControlName="phone" type="tel">
          <mat-error *ngIf="employeeForm.get('contactNo')?.touched && employeeForm.get('contactNo')?.invalid">
            Enter a valid contact number
          </mat-error>
        </mat-form-field>

        <!-- Department -->
        <mat-form-field appearance="fill" style="width: 100%;">
          <mat-label>Department</mat-label>
          <input matInput formControlName="department">
        </mat-form-field>

        <!-- Status -->
         <mat-form-field *ngIf="editMode" appearance="fill" style="width: 100%;">
           <mat-label>Status</mat-label>
           <mat-select formControlName="status">
           <mat-option value="active">Active</mat-option>
           <mat-option value="unactive">Unactive</mat-option>
           <mat-option value="admin">Admin</mat-option>
           </mat-select>
           <mat-error *ngIf="employeeForm.get('status')?.touched && employeeForm.get('status')?.invalid">
             Status is required
           </mat-error>
         </mat-form-field>


        <!-- Join Date -->
        <mat-form-field appearance="fill" style="width: 100%;">
          <mat-label>Join Date</mat-label>
          <input matInput type="date" formControlName="joiningDate">
        </mat-form-field>

        <!-- Description -->
        <mat-form-field appearance="fill" style="width: 100%;">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description"></textarea>
        </mat-form-field>

        <!-- Submit Button -->
        <div style="display: flex; justify-content: center; margin-top: 16px;">
          <button mat-raised-button color="primary" type="submit" [disabled]="employeeForm.invalid">
            Submit
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
